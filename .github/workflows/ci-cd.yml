name: AI Resume Screening CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Linting, Syntax Validation, and Automated Pytest Suite
  # ----------------------------------------------------------------------------
  test:
    name: Lint & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Runtime (3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate Python Syntax & Bytecode Compilation
        run: |
          python -m py_compile Main.py resume_utils.py
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv

      - name: Run Automated Pytest Suite
        run: |
          pytest tests/ -v

  # ----------------------------------------------------------------------------
  # Job 2: Build & Validate Docker Container Image
  # ----------------------------------------------------------------------------
  build-container:
    name: Build & Validate Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ai-resume-screening:latest
          load: true

      - name: Validate Container Run & Health Check
        run: |
          echo "Starting container in background..."
          docker run -d --name resume-app-test -p 8501:8501 ai-resume-screening:latest
          
          echo "Waiting for Streamlit server initialization..."
          sleep 6
          
          echo "Checking container status..."
          docker ps | grep resume-app-test
          
          echo "Verifying HTTP responsiveness and health endpoint..."
          curl --fail --retry 5 --retry-delay 2 http://localhost:8501/_stcore/health || exit 1
          
          echo "Container build validation successful. Stopping container."
          docker stop resume-app-test && docker rm resume-app-test

  # ----------------------------------------------------------------------------
  # Job 3: Amazon ECR Publishing & Cloud Deployment Stage
  # Authenticates securely via AWS OIDC (zero static long-lived access keys)
  # ----------------------------------------------------------------------------
  deploy:
    name: Publish to Amazon ECR & Cloud Deploy
    needs: build-container
    if: github.ref == 'refs/heads/main' && vars.ENABLE_AWS_DEPLOY == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and Push Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ai-resume-screening
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag ai-resume-screening:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag ai-resume-screening:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Successfully pushed $ECR_REPOSITORY:$IMAGE_TAG to $ECR_REGISTRY"
