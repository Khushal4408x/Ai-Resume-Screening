name: AI Resume Screening CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Linting, Syntax Validation, and Automated Unit Testing
  # ----------------------------------------------------------------------------
  test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Runtime (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate Python Syntax & Bytecode Compilation
        run: |
          python -m py_compile Main.py resume_utils.py
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv

      - name: Run Automated Unit Tests
        run: |
          python -m unittest discover tests -v

  # ----------------------------------------------------------------------------
  # Job 2: Build & Validate Docker Container Image
  # ----------------------------------------------------------------------------
  build-container:
    name: Build & Validate Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ai-resume-screening:latest
          load: true

      - name: Validate Container Run & Health Check
        run: |
          echo "Starting container in background..."
          docker run -d --name resume-app-test -p 8501:8501 ai-resume-screening:latest
          
          echo "Waiting for Streamlit server initialization..."
          sleep 5
          
          echo "Checking container status..."
          docker ps | grep resume-app-test
          
          echo "Verifying HTTP responsiveness..."
          curl --fail --retry 3 --retry-delay 2 http://localhost:8501/_stcore/health || exit 1
          
          echo "Container build validation successful. Stopping container."
          docker stop resume-app-test && docker rm resume-app-test

  # ----------------------------------------------------------------------------
  # Job 3: Continuous Deployment (Documented Production Blueprint)
  # Pending AWS credentials and target cloud infrastructure provisioning
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to Cloud (AWS EC2 / ECR)
    needs: build-container
    if: github.ref == 'refs/heads/main' && false # Set to true when AWS credentials are configured
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and Push Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ai-resume-screening
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag ai-resume-screening:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update Target EC2 / Container Host
        run: |
          echo "Deployment trigger dispatched to target instance via AWS SSM / EC2 User Data"
