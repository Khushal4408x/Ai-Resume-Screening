<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="440" rx="12" fill="url(#bgGrad2)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Banner -->
  <rect x="25" y="16" width="870" height="40" rx="8" fill="url(#bannerGrad)"/>
  <text x="460" y="41" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    PRACTICAL CI/CD PIPELINE ARCHITECTURE (GITHUB ACTIONS &amp; DOCKER)
  </text>

  <!-- Stage 1: Developer Workstation -->
  <g transform="translate(30, 80)" filter="url(#shadow)">
    <rect width="180" height="320" rx="8" fill="url(#boxGrad1)" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 172 0 Q 180 0 180 8 L 180 34 L 0 34 Z" fill="#334155"/>
    <text x="90" y="22" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">1. Local Dev &amp; Git</text>

    <rect x="12" y="48" width="156" height="65" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="68" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">Developer Tasks</text>
    <text x="20" y="86" fill="#475569" font-family="sans-serif" font-size="10">• Python 3.11 VirtualEnv</text>
    <text x="20" y="100" fill="#475569" font-family="sans-serif" font-size="10">• Feature modification</text>

    <rect x="12" y="125" width="156" height="75" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="145" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">Git Version Control</text>
    <text x="20" y="163" fill="#475569" font-family="sans-serif" font-size="10">• git add / commit</text>
    <text x="20" y="177" fill="#475569" font-family="sans-serif" font-size="10">• Branch: main/features</text>
    <text x="20" y="191" fill="#475569" font-family="sans-serif" font-size="10">• Local test execution</text>

    <rect x="12" y="212" width="156" height="85" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="20" y="232" fill="#1e40af" font-family="sans-serif" font-size="11" font-weight="700">Push to Remote</text>
    <text x="20" y="250" fill="#475569" font-family="sans-serif" font-size="10">• git push origin main</text>
    <text x="20" y="264" fill="#475569" font-family="sans-serif" font-size="10">• GitHub Pull Request</text>
    <text x="20" y="278" fill="#475569" font-family="sans-serif" font-size="10">• Webhook trigger sent</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="210" y1="240" x2="248" y2="240" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowHead)"/>

  <!-- Stage 2: GitHub Repository & Actions Trigger -->
  <g transform="translate(250, 80)" filter="url(#shadow)">
    <rect width="190" height="320" rx="8" fill="url(#boxGrad1)" stroke="#bfdbfe" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 182 0 Q 190 0 190 8 L 190 34 L 0 34 Z" fill="#2563eb"/>
    <text x="95" y="22" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">2. CI Workflow Trigger</text>

    <rect x="12" y="48" width="166" height="75" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="20" y="68" fill="#1e3a8a" font-family="sans-serif" font-size="11" font-weight="700">GitHub Actions Runner</text>
    <text x="20" y="86" fill="#334155" font-family="sans-serif" font-size="10">• Host: ubuntu-latest</text>
    <text x="20" y="100" fill="#334155" font-family="sans-serif" font-size="10">• Event: push / pull_request</text>
    <text x="20" y="114" fill="#334155" font-family="sans-serif" font-size="10">• actions/checkout@v4</text>

    <rect x="12" y="135" width="166" height="85" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="20" y="155" fill="#1e3a8a" font-family="sans-serif" font-size="11" font-weight="700">Python Environment</text>
    <text x="20" y="173" fill="#334155" font-family="sans-serif" font-size="10">• actions/setup-python@v5</text>
    <text x="20" y="187" fill="#334155" font-family="sans-serif" font-size="10">• Version: 3.11 Runtime</text>
    <text x="20" y="201" fill="#334155" font-family="sans-serif" font-size="10">• pip cache restore</text>

    <rect x="12" y="232" width="166" height="65" rx="5" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="20" y="252" fill="#065f46" font-family="sans-serif" font-size="11" font-weight="700">Dependency Install</text>
    <text x="20" y="270" fill="#334155" font-family="sans-serif" font-size="10">• pip install --upgrade pip</text>
    <text x="20" y="284" fill="#334155" font-family="sans-serif" font-size="10">• pip install -r reqs.txt</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="440" y1="240" x2="478" y2="240" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowHead)"/>

  <!-- Stage 3: Test & Quality Gate -->
  <g transform="translate(480, 80)" filter="url(#shadow)">
    <rect width="190" height="320" rx="8" fill="url(#boxGrad1)" stroke="#a7f3d0" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 182 0 Q 190 0 190 8 L 190 34 L 0 34 Z" fill="#059669"/>
    <text x="95" y="22" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">3. Automated Test Gate</text>

    <rect x="12" y="48" width="166" height="75" rx="5" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
    <text x="20" y="68" fill="#065f46" font-family="sans-serif" font-size="11" font-weight="700">Syntax &amp; Static Lint</text>
    <text x="20" y="86" fill="#334155" font-family="sans-serif" font-size="10">• python -m py_compile</text>
    <text x="20" y="100" fill="#334155" font-family="sans-serif" font-size="10">• flake8 syntax validation</text>
    <text x="20" y="114" fill="#334155" font-family="sans-serif" font-size="10">• Undefined variable check</text>

    <rect x="12" y="135" width="166" height="100" rx="5" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
    <text x="20" y="155" fill="#065f46" font-family="sans-serif" font-size="11" font-weight="700">Automated Unit Tests</text>
    <text x="20" y="173" fill="#334155" font-family="sans-serif" font-size="10">• unittest discover tests</text>
    <text x="20" y="187" fill="#334155" font-family="sans-serif" font-size="10">• PDF text extraction test</text>
    <text x="20" y="201" fill="#334155" font-family="sans-serif" font-size="10">• TF-IDF cosine score test</text>
    <text x="20" y="215" fill="#334155" font-family="sans-serif" font-size="10">• Ranking order &amp; badges</text>

    <rect x="12" y="247" width="166" height="50" rx="5" fill="#d1fae5" stroke="#34d399" stroke-width="1"/>
    <text x="95" y="268" fill="#065f46" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">STATUS: PASSED</text>
    <text x="95" y="284" fill="#047857" font-family="sans-serif" font-size="9.5" text-anchor="middle">7/7 Tests Succeeded (0.21s)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="670" y1="240" x2="708" y2="240" stroke="#059669" stroke-width="2" marker-end="url(#arrowHead)"/>

  <!-- Stage 4: Docker Build & Future Cloud Deploy -->
  <g transform="translate(710, 80)" filter="url(#shadow)">
    <rect width="180" height="320" rx="8" fill="url(#boxGrad1)" stroke="#fed7aa" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 172 0 Q 180 0 180 8 L 180 34 L 0 34 Z" fill="#d97706"/>
    <text x="90" y="22" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">4. Docker &amp; Cloud CD</text>

    <rect x="12" y="48" width="156" height="90" rx="5" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
    <text x="20" y="68" fill="#92400e" font-family="sans-serif" font-size="11" font-weight="700">Docker Image Build</text>
    <text x="20" y="86" fill="#334155" font-family="sans-serif" font-size="10">• docker buildx build</text>
    <text x="20" y="100" fill="#334155" font-family="sans-serif" font-size="10">• Base: python:3.11-slim</text>
    <text x="20" y="114" fill="#334155" font-family="sans-serif" font-size="10">• Non-root user (appuser)</text>
    <text x="20" y="128" fill="#334155" font-family="sans-serif" font-size="10">• Healthcheck validated</text>

    <rect x="12" y="148" width="156" height="150" rx="5" fill="#fff7ed" stroke="#fdba74" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="20" y="168" fill="#c2410c" font-family="sans-serif" font-size="11" font-weight="700">Future CD (Proposed)</text>
    <text x="20" y="186" fill="#64748b" font-family="sans-serif" font-size="10">• AWS OIDC Federation</text>
    <text x="20" y="200" fill="#64748b" font-family="sans-serif" font-size="10">• Push to Amazon ECR</text>
    <text x="20" y="214" fill="#64748b" font-family="sans-serif" font-size="10">• Deploy on EC2 Host</text>
    <text x="20" y="228" fill="#64748b" font-family="sans-serif" font-size="10">• Zero-downtime rolling</text>
    <text x="20" y="248" fill="#b45309" font-family="sans-serif" font-size="9" font-style="italic">*(Awaiting AWS secrets)*</text>
    <rect x="25" y="260" width="130" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="90" y="276" fill="#b45309" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">CD STAGE READY</text>
  </g>
</svg>
